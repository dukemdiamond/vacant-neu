name: Scrape Banner

on:
  schedule:
    # 04:15 ET (09:15 UTC) daily — off-peak for Banner, and the artifact is fresh before classes.
    - cron: "15 9 * * *"
  workflow_dispatch:
    inputs:
      term:
        description: "Banner term code (blank = auto-detect current term)"
        required: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The vacancy engine gates the data: if its behaviour has drifted, we don't publish.
      - run: pnpm test

      - name: Scrape classes
        run: pnpm scrape ${{ inputs.term && format('--term {0}', inputs.term) || '' }}

      # Club events are a secondary source behind a credential that expires, so a failure here
      # must not stop the class schedule publishing. Exit code 2 means the Engage session needs a
      # manual refresh; anything else is a transient fault worth ignoring until the next run.
      - name: Scrape club events
        id: events
        continue-on-error: true
        env:
          ENGAGE_SESSION_ID: ${{ secrets.ENGAGE_SESSION_ID }}
          ENGAGE_UID: ${{ secrets.ENGAGE_UID }}
        run: pnpm events

      # Exit 2 is a refused session, exit 3 a refusal to overwrite good data with a thin pull.
      # Both mean the same thing in practice: the cookie needs replacing. Neither is fatal, since
      # events are future-dated and the existing artifact stays useful for weeks.
      - name: Open an issue when the Engage session needs refreshing
        if: steps.events.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Engage session cookie needs refreshing";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "engage-session",
            });
            if (open.length > 0) {
              core.info("An issue is already open; not filing another.");
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title,
              labels: ["engage-session"],
              body: [
                "The club event scrape could not use the stored Engage session, so `data/events.json`",
                "was left untouched. Existing bookings stay live, but no new ones are being picked up.",
                "",
                "To fix:",
                "1. Sign in to https://engage.northeastern.edu",
                "2. DevTools -> Application -> Cookies -> engage.northeastern.edu",
                "3. Copy `CG.SessionID` and `cg_uid` **verbatim**, without decoding `%2b` or `%3d`",
                "4. Update the `ENGAGE_SESSION_ID` and `ENGAGE_UID` repository secrets",
                "5. Re-run this workflow",
                "",
                `Failed run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join("\n"),
            });

      # The scraper exits non-zero on an implausible result set, so reaching this step means the
      # artifact passed its sanity floors. Nothing is committed when the data is unchanged.
      - name: Commit updated data
        run: |
          if [[ -z "$(git status --porcelain data/)" ]]; then
            echo "No schedule changes."
            exit 0
          fi
          git config user.name "vacantneu-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git commit -m "data: refresh schedule and club events ($(date -u +%Y-%m-%d))"
          git push
