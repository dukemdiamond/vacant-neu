name: Scrape Banner

on:
  schedule:
    # 09:15 UTC daily (04:15 EST / 05:15 EDT), off-peak for Banner.
    - cron: "15 9 * * *"
  workflow_dispatch:
    inputs:
      term:
        description: "Banner term code (blank = auto-detect current term)"
        required: false

permissions:
  contents: write
  issues: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Use the exact version pinned in package.json; a second version can conflict.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The vacancy engine gates the data: if its behaviour has drifted, we don't publish.
      - name: Test
        id: test
        run: pnpm test

      # A refusal here fails the job, but the steps after it still run: the class schedule and club
      # events are independent sources, and one being refused is no reason to freeze the other.
      - name: Scrape classes
        id: classes
        run: pnpm scrape ${{ inputs.term && format('--term {0}', inputs.term) || '' }}

      # A refused scrape leaves the site serving stale data, which nothing on the page reveals.
      # Failed scheduled runs are easy to miss, so file an issue the first time it happens.
      - name: Open an issue when the class scrape is refused
        if: ${{ !cancelled() && steps.classes.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "scrape-failure",
            });
            if (open.length > 0) {
              core.info("An issue is already open; not filing another.");
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: "Class schedule scrape is being refused",
              labels: ["scrape-failure"],
              body: [
                "The Banner scrape did not publish, so the site is still serving the last good",
                "schedule. Every run fails until this is fixed, and nothing on the page shows it.",
                "",
                "Check the log of the failed run for which term was chosen and why, then:",
                "- **Below a plausibility floor**: if the chosen term is the right one, Banner may",
                "  be degraded or room assignments may not be published yet; re-run later.",
                "- **Wrong term chosen**: dispatch this workflow with an explicit `term`, and fix",
                "  the selection in `packages/scraper/src/term.ts`.",
                "- **Schema or network error**: Banner changed shape or is down.",
                "",
                "Close this issue once a run succeeds.",
                "",
                `Failed run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join("\n"),
            });

      # Club events are a secondary source behind a credential that expires, so a failure here
      # must not stop the class schedule publishing. Exit code 2 means the Engage session needs a
      # manual refresh; anything else is a transient fault worth ignoring until the next run.
      - name: Scrape club events
        id: events
        if: ${{ !cancelled() && steps.test.outcome == 'success' }}
        continue-on-error: true
        env:
          ENGAGE_SESSION_ID: ${{ secrets.ENGAGE_SESSION_ID }}
          ENGAGE_UID: ${{ secrets.ENGAGE_UID }}
        run: pnpm events

      # Exit 2 is a refused session, exit 3 a refusal to overwrite good data with a thin pull.
      # Both mean the same thing in practice: the cookie needs replacing. Neither is fatal, since
      # events are future-dated and the existing artifact stays useful for weeks.
      - name: Open an issue when the Engage session needs refreshing
        if: ${{ !cancelled() && steps.events.outcome == 'failure' }}
        # An alerting failure must not prevent publishing a successful class scrape.
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Engage session cookie needs refreshing";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "engage-session",
            });
            if (open.length > 0) {
              core.info("An issue is already open; not filing another.");
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title,
              labels: ["engage-session"],
              body: [
                "The club event scrape could not use the stored Engage session, so `data/events.json`",
                "was left untouched. Existing bookings stay live, but no new ones are being picked up.",
                "",
                "To fix:",
                "1. Sign in to https://engage.northeastern.edu",
                "2. DevTools -> Application -> Cookies -> engage.northeastern.edu",
                "3. Copy `CG.SessionID` and `cg_uid` **verbatim**, without decoding `%2b` or `%3d`",
                "4. Update the `ENGAGE_SESSION_ID` and `ENGAGE_UID` repository secrets",
                "5. Re-run this workflow",
                "",
                `Failed run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join("\n"),
            });

      # Each scraper writes only an artifact that passed its own gates, so whatever changed under
      # data/ is publishable even when the other source was refused. Nothing is committed when the
      # data is unchanged.
      - name: Commit updated data
        if: ${{ !cancelled() && steps.test.outcome == 'success' }}
        run: |
          if [[ -z "$(git status --porcelain data/)" ]]; then
            echo "No schedule changes."
            exit 0
          fi
          git config user.name "vacantneu-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git commit -m "data: refresh schedule and club events ($(date -u +%Y-%m-%d))"
          git push
